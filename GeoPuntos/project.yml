name: GeoPuntos
options:
  bundleIdPrefix: com.quino
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  GeoPuntos:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GeoPuntos
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quino.GeoPuntos
        INFOPLIST_FILE: GeoPuntos/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - whatsapp
          - googlemaps